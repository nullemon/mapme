<svg xmlns="http://www.w3.org/2000/svg" viewBox="-256 -256 512 512" width="2048" height="2048">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4a6b"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b8a3e"/>
      <stop offset="50%" stop-color="#5a7a35"/>
      <stop offset="100%" stop-color="#4a6a2c"/>
    </linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a44a"/>
      <stop offset="100%" stop-color="#a88a3a"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8dde6"/>
      <stop offset="100%" stop-color="#b8c4d4"/>
    </linearGradient>
    <linearGradient id="swamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a2a"/>
      <stop offset="100%" stop-color="#2a4a1a"/>
    </linearGradient>
    <linearGradient id="burned" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3020"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" seed="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <pattern id="waves" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q5 0 10 5 Q15 10 20 5" fill="none" stroke="#3a5a7b" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="trees" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#3a6a1e" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Ocean background -->
  <rect x="-256" y="-256" width="512" height="512" fill="url(#ocean)"/>
  <rect x="-256" y="-256" width="512" height="512" fill="url(#waves)"/>

  <!-- Main continent shape - Eastern Kingdoms -->
  <g filter="url(#shadow)">
    <!-- Northern landmass (Lordaeron) -->
    <path d="M-60,-240 L20,-245 L80,-230 L100,-200 L120,-180 L110,-150 L100,-120 L90,-100 L80,-80 L70,-60 L60,-40 L50,-20 L40,0 L30,20 L20,30 L10,40 L0,50 L-20,55 L-30,50 L-40,40 L-50,30 L-60,10 L-70,-10 L-80,-30 L-90,-60 L-95,-90 L-90,-120 L-85,-150 L-80,-180 L-75,-210 Z"
      fill="url(#land)" stroke="#4a5a2c" stroke-width="1.5"/>

    <!-- Southern landmass (Azeroth - Stormwind region) -->
    <path d="M-30,50 L0,50 L20,30 L40,60 L60,80 L80,100 L90,130 L85,160 L70,190 L50,210 L30,220 L10,225 L-10,220 L-30,210 L-50,190 L-60,160 L-65,130 L-60,100 L-50,80 L-40,65 Z"
      fill="url(#land)" stroke="#4a5a2c" stroke-width="1.5"/>
  </g>

  <!-- Terrain zones -->
  <!-- Tirisfal Glades (north, darker) -->
  <path d="M-50,-230 L10,-235 L60,-220 L50,-200 L30,-190 L10,-195 L-20,-200 L-40,-210 Z"
    fill="url(#swamp)" opacity="0.6"/>

  <!-- Silverpine Forest -->
  <path d="M-70,-200 L-40,-210 L-20,-200 L-30,-170 L-50,-160 L-70,-170 Z"
    fill="#2a4a1a" opacity="0.5"/>

  <!-- Plaguelands (northeast, burned) -->
  <path d="M40,-210 L80,-200 L100,-180 L90,-150 L70,-140 L50,-150 L40,-170 L30,-190 Z"
    fill="url(#burned)" opacity="0.5"/>

  <!-- Hinterlands -->
  <path d="M70,-140 L100,-130 L95,-100 L75,-90 L60,-100 L55,-120 Z"
    fill="#5a7a35" opacity="0.6"/>

  <!-- Arathi Highlands -->
  <path d="M50,-100 L80,-80 L70,-60 L40,-70 L35,-90 Z"
    fill="#8a9a5a" opacity="0.5"/>

  <!-- Wetlands (darker green, swampy) -->
  <path d="M30,-60 L60,-50 L55,-30 L40,-20 L25,-30 L20,-45 Z"
    fill="url(#swamp)" opacity="0.5"/>

  <!-- Dun Morogh (snowy mountains) -->
  <path d="M-30,-80 L10,-85 L30,-60 L20,-40 L0,-30 L-20,-35 L-35,-50 L-40,-65 Z"
    fill="url(#snow)" opacity="0.5"/>

  <!-- Loch Modan -->
  <path d="M20,-50 L40,-40 L35,-20 L15,-15 L5,-25 Z"
    fill="#4a7a3e" opacity="0.5"/>

  <!-- Burning Steppes -->
  <path d="M-20,10 L10,5 L20,25 L5,40 L-15,35 L-25,20 Z"
    fill="url(#burned)" opacity="0.4"/>

  <!-- Elwynn Forest -->
  <path d="M-10,60 L20,55 L40,70 L45,95 L30,110 L10,115 L-10,105 L-20,85 Z"
    fill="#4a8a2e" opacity="0.6"/>

  <!-- Stranglethorn Vale (jungle, south) -->
  <path d="M-20,140 L20,135 L40,160 L35,195 L15,215 L-10,218 L-30,200 L-40,170 Z"
    fill="#2a6a1a" opacity="0.5"/>

  <!-- Westfall (dry farmland) -->
  <path d="M-55,80 L-25,75 L-15,100 L-30,120 L-50,115 L-60,95 Z"
    fill="url(#desert)" opacity="0.4"/>

  <!-- Redridge Mountains -->
  <path d="M30,80 L55,75 L65,95 L55,115 L35,120 L25,105 Z"
    fill="#8a5a3a" opacity="0.4"/>

  <!-- Swamp of Sorrows -->
  <path d="M45,110 L70,105 L75,130 L60,145 L40,140 L35,125 Z"
    fill="url(#swamp)" opacity="0.5"/>

  <!-- Deadwind Pass -->
  <path d="M15,115 L35,110 L40,130 L25,140 L10,135 Z"
    fill="#3a3030" opacity="0.4"/>

  <!-- Blasted Lands -->
  <path d="M40,140 L65,135 L70,165 L55,180 L35,175 L30,155 Z"
    fill="#6a3a2a" opacity="0.4"/>

  <!-- Mountain ranges -->
  <g fill="#6a6a5a" opacity="0.7">
    <!-- Northern mountains -->
    <polygon points="-65,-180 -55,-195 -45,-180"/>
    <polygon points="-55,-175 -45,-190 -35,-175"/>
    <polygon points="-75,-170 -65,-185 -55,-170"/>
    <!-- Alterac Mountains -->
    <polygon points="-10,-150 0,-168 10,-150"/>
    <polygon points="5,-145 15,-163 25,-145"/>
    <polygon points="-20,-148 -10,-166 0,-148"/>
    <!-- Ironforge mountains -->
    <polygon points="-30,-70 -20,-88 -10,-70"/>
    <polygon points="-20,-65 -10,-83 0,-65"/>
    <polygon points="-40,-60 -30,-78 -20,-60"/>
    <polygon points="-10,-55 0,-73 10,-55"/>
    <!-- Redridge mountains -->
    <polygon points="40,82 50,68 60,82"/>
    <polygon points="50,88 60,74 70,88"/>
    <!-- Burning steppes mountains -->
    <polygon points="-15,15 -5,0 5,15"/>
    <polygon points="0,18 10,3 20,18"/>
  </g>

  <!-- Lakes and rivers -->
  <g fill="#2a5a8b" opacity="0.7">
    <!-- Lordamere Lake -->
    <ellipse cx="-20" cy="-175" rx="15" ry="10"/>
    <!-- Darrowmere Lake -->
    <ellipse cx="55" cy="-170" rx="12" ry="8"/>
    <!-- Loch Modan lake -->
    <ellipse cx="18" cy="-35" rx="8" ry="12"/>
    <!-- Crystal Lake (Elwynn) -->
    <ellipse cx="25" cy="95" rx="6" ry="5"/>
  </g>

  <!-- Rivers -->
  <g fill="none" stroke="#2a5a8b" stroke-width="2" opacity="0.6">
    <path d="M-20,-165 L-25,-140 L-30,-120 L-25,-100 L-20,-80"/>
    <path d="M55,-155 L50,-130 L45,-110 L40,-90"/>
    <path d="M10,-30 L5,-10 L0,10 L-5,30 L-10,50 L-5,70"/>
    <path d="M-5,70 L0,90 L5,110 L10,130 L5,150 L0,170 L-5,200"/>
  </g>

  <!-- Roads/paths -->
  <g fill="none" stroke="#8a7a5a" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5">
    <path d="M-20,-220 L-10,-190 L0,-160 L5,-130 L0,-100 L-10,-70 L-5,-40 L0,-10 L5,20 L0,50 L5,80 L0,110 L-5,140 L0,170 L5,200"/>
    <path d="M-40,-60 L-20,-40 L0,-30 L20,-20"/>
    <path d="M5,80 L-30,90 L-50,95"/>
    <path d="M5,80 L35,85 L55,90"/>
  </g>

  <!-- Zone labels -->
  <g font-family="serif" fill="#d4c4a0" text-anchor="middle" filter="url(#shadow)">
    <text x="0" y="-215" font-size="9" font-weight="bold" letter-spacing="3">TIRISFAL GLADES</text>
    <text x="-50" y="-180" font-size="6" letter-spacing="1">Silverpine</text>
    <text x="65" y="-170" font-size="6" letter-spacing="1">Plaguelands</text>
    <text x="-5" y="-155" font-size="6" letter-spacing="1">Alterac</text>
    <text x="70" y="-110" font-size="6" letter-spacing="1">Hinterlands</text>
    <text x="60" y="-70" font-size="6" letter-spacing="1">Arathi</text>
    <text x="40" y="-35" font-size="6" letter-spacing="1">Wetlands</text>
    <text x="-20" y="-55" font-size="7" font-weight="bold" letter-spacing="1">DUN MOROGH</text>
    <text x="15" y="-25" font-size="5" letter-spacing="1">Loch Modan</text>
    <text x="-5" y="20" font-size="5" letter-spacing="1">Burning Steppes</text>
    <text x="5" y="85" font-size="8" font-weight="bold" fill="#8adb4a" letter-spacing="2">ELWYNN FOREST</text>
    <text x="-40" y="98" font-size="6" letter-spacing="1">Westfall</text>
    <text x="50" y="95" font-size="5" letter-spacing="1">Redridge</text>
    <text x="55" y="128" font-size="5" letter-spacing="1">Swamp of Sorrows</text>
    <text x="50" y="160" font-size="5" letter-spacing="1">Blasted Lands</text>
    <text x="20" y="128" font-size="4" letter-spacing="1">Deadwind</text>
    <text x="0" y="180" font-size="8" font-weight="bold" fill="#3aaa3a" letter-spacing="2">STRANGLETHORN</text>
    <text x="0" y="192" font-size="6" fill="#3aaa3a" letter-spacing="2">VALE</text>
  </g>

  <!-- City/town markers -->
  <g>
    <!-- Undercity -->
    <rect x="-8" y="-223" width="10" height="8" rx="1" fill="#8a4a6a" stroke="#aa6a8a" stroke-width="0.8" opacity="0.8"/>
    <text x="-3" y="-227" font-family="serif" font-size="5" fill="#da8aba" text-anchor="middle">Undercity</text>
    <!-- Ironforge -->
    <rect x="-18" y="-63" width="10" height="8" rx="1" fill="#6a8aaa" stroke="#8aaaca" stroke-width="0.8" opacity="0.8"/>
    <text x="-13" y="-67" font-family="serif" font-size="5" fill="#aacaea" text-anchor="middle">Ironforge</text>
    <!-- Stormwind -->
    <rect x="-8" y="68" width="12" height="10" rx="1" fill="#4a6ada" stroke="#6a8afa" stroke-width="0.8" opacity="0.8"/>
    <text x="-2" y="64" font-family="serif" font-size="6" fill="#8abaff" text-anchor="middle" font-weight="bold">Stormwind</text>
    <!-- Booty Bay -->
    <rect x="-3" y="210" width="8" height="6" rx="1" fill="#aa8a4a" stroke="#caaa6a" stroke-width="0.8" opacity="0.8"/>
    <text x="1" y="220" font-family="serif" font-size="4" fill="#caaa6a" text-anchor="middle">Booty Bay</text>
  </g>

  <!-- Title -->
  <text x="0" y="-242" font-family="serif" font-size="14" font-weight="bold" fill="#d4c4a0" text-anchor="middle" letter-spacing="5" filter="url(#shadow)">EASTERN KINGDOMS</text>

  <!-- Compass rose (bottom-right) -->
  <g transform="translate(210,210)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#8a7a5a" stroke-width="0.8" opacity="0.5"/>
    <polygon points="0,-15 3,-5 0,-8 -3,-5" fill="#d4c4a0" opacity="0.7"/>
    <polygon points="0,15 3,5 0,8 -3,5" fill="#8a7a5a" opacity="0.5"/>
    <polygon points="-15,0 -5,3 -8,0 -5,-3" fill="#8a7a5a" opacity="0.5"/>
    <polygon points="15,0 5,3 8,0 5,-3" fill="#8a7a5a" opacity="0.5"/>
    <text x="0" y="-20" font-family="serif" font-size="5" fill="#d4c4a0" text-anchor="middle">N</text>
    <text x="0" y="25" font-family="serif" font-size="4" fill="#8a7a5a" text-anchor="middle">S</text>
    <text x="-20" y="2" font-family="serif" font-size="4" fill="#8a7a5a" text-anchor="middle">W</text>
    <text x="20" y="2" font-family="serif" font-size="4" fill="#8a7a5a" text-anchor="middle">E</text>
  </g>

  <!-- Decorative border -->
  <rect x="-254" y="-254" width="508" height="508" fill="none" stroke="#6a5a3a" stroke-width="2" rx="4"/>
  <rect x="-250" y="-250" width="500" height="500" fill="none" stroke="#4a3a2a" stroke-width="0.5" rx="3"/>
</svg>
